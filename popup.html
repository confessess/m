<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unsuspecting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="popup.css">
    <base target="_blank">
</head>
<body>
    <div class="frost-pane">
        <!-- Snow layers -->
        <div class="snow-layer" id="snow-back"></div>
        <div class="snow-layer" id="snow-mid"></div>
        <div class="snow-layer" id="snow-front"></div>

        <!-- Frost overlay -->
        <div class="frost-overlay"></div>

        <!-- Icicle accents -->
        <div class="icicle icicle-1"></div>
        <div class="icicle icicle-2"></div>
        <div class="icicle icicle-3"></div>

        <header class="frost-header">
            <div class="header-inner">
                <div class="sigil">
                    <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
                        <path d="M14 2L4 8L14 14L24 8L14 2Z" stroke="#a8c4e0" stroke-width="1.2" fill="none" opacity="0.6"/>
                        <path d="M4 14L14 20L24 14" stroke="#a8c4e0" stroke-width="1.2" fill="none" opacity="0.4"/>
                        <path d="M4 20L14 26L24 20" stroke="#a8c4e0" stroke-width="1.2" fill="none" opacity="0.2"/>
                        <circle cx="14" cy="14" r="3" fill="#c5d8ed" opacity="0.3"/>
                    </svg>
                </div>
                <div class="header-text">
                    <h1>Unsuspecting</h1>
                    <p class="subtitle">frost injection toolkit</p>
                </div>
            </div>
            <div class="temp-badge">
                <span class="temp-dot"></span>
                <span class="temp-text">v1.2</span>
            </div>
        </header>

        <nav class="frost-tabs">
            <button class="frost-tab active" data-tab="core">
                <span class="tab-frost"></span>
                <span class="tab-label">core</span>
            </button>
            <button class="frost-tab" data-tab="target">
                <span class="tab-frost"></span>
                <span class="tab-label">target</span>
            </button>
            <button class="frost-tab" data-tab="items">
                <span class="tab-frost"></span>
                <span class="tab-label">items</span>
            </button>
            <button class="frost-tab" data-tab="ledger">
                <span class="tab-frost"></span>
                <span class="tab-label">ledger</span>
            </button>
        </nav>

        <main class="frost-body">
            <!-- CORE TAB -->
            <div class="frost-panel active" id="panel-core">
                <div class="frost-field">
                    <label class="frost-label">
                        <span class="label-mark">◈</span>
                        Robux Balance
                    </label>
                    <div class="frost-input-wrap">
                        <span class="input-ornament">R$</span>
                        <input type="number" id="robux-amount" value="10000000">
                    </div>
                </div>

                <div class="frost-divider">
                    <span class="divider-ice"></span>
                </div>

                <div class="frost-field">
                    <label class="frost-label">
                        <span class="label-mark">◎</span>
                        Display Name
                    </label>
                    <div class="frost-input-wrap">
                        <input type="text" id="display-name" placeholder="who they see">
                    </div>
                </div>

                <div class="frost-divider">
                    <span class="divider-ice"></span>
                </div>

                <div class="frost-field">
                    <label class="frost-label">
                        <span class="label-mark">@</span>
                        Username
                    </label>
                    <div class="frost-input-wrap">
                        <input type="text" id="username" placeholder="@handle">
                    </div>
                </div>

                <div class="frost-divider">
                    <span class="divider-ice"></span>
                </div>

                <div class="frost-field">
                    <label class="frost-label">
                        <span class="label-mark">◉</span>
                        Followers
                    </label>
                    <div class="frost-input-wrap">
                        <input type="number" id="follower-count" placeholder="0">
                    </div>
                </div>

                <div class="frost-actions">
                    <button id="save-btn" class="frost-btn primary">
                        <span class="btn-shimmer"></span>
                        <span class="btn-text">Commit</span>
                    </button>
                    <button id="reset-btn" class="frost-btn ghost">
                        <span class="btn-text">Purge</span>
                    </button>
                </div>
            </div>

            <!-- TARGET TAB -->
            <div class="frost-panel" id="panel-target">
                <div class="frost-field">
                    <label class="frost-label">
                        <span class="label-mark">◈</span>
                        Larp As
                    </label>
                    <div class="frost-input-wrap dual">
                        <input type="text" id="target-username" placeholder="username">
                        <button id="target-load-btn" class="frost-btn slim">Load</button>
                    </div>
                </div>

                <div id="target-preview" class="target-preview"></div>

                <div class="target-opts">
                    <label><input type="checkbox" id="opt-name" checked> name + handle</label>
                    <label><input type="checkbox" id="opt-bio" checked> bio</label>
                    <label><input type="checkbox" id="opt-followers" checked> followers</label>
                    <label><input type="checkbox" id="opt-outfit" checked> outfit + body</label>
                </div>

                <div class="frost-actions">
                    <button id="target-apply-btn" class="frost-btn primary" disabled>
                        <span class="btn-shimmer"></span>
                        <span class="btn-text">Apply</span>
                    </button>
                    <button id="target-clear-btn" class="frost-btn ghost">
                        <span class="btn-text">Clear</span>
                    </button>
                </div>
            </div>

            <!-- ITEMS TAB -->
            <div class="frost-panel" id="panel-items">
                <div class="frost-field">
                    <label class="frost-label">
                        <span class="label-mark">+</span>
                        Inject Asset
                    </label>
                    <div class="frost-input-wrap dual">
                        <input type="number" id="manual-item-id" placeholder="Asset ID">
                        <button id="add-item-btn" class="frost-btn slim">Add</button>
                    </div>
                </div>

                <div class="frost-divider">
                    <span class="divider-ice"></span>
                </div>

                <div class="inventory-vault">
                    <div class="vault-header">
                        <span class="vault-title">Simulated Inventory</span>
                        <span class="vault-count" id="inv-count">0 items</span>
                    </div>
                    <div class="vault-grid" id="inventory-preview-grid"></div>
                </div>
            </div>

            <!-- LEDGER TAB -->
            <div class="frost-panel" id="panel-ledger">
                <div class="frost-field">
                    <label class="frost-label">
                        <span class="label-mark">$</span>
                        New Entry
                    </label>
                    <div class="ledger-form">
                        <input type="text" id="tx-desc" placeholder="Description">
                        <input type="text" id="tx-type" placeholder="Type" value="Purchase">
                        <div class="ledger-row">
                            <input type="number" id="tx-amount" placeholder="Amount">
                            <input type="date" id="tx-date">
                        </div>
                        <button id="add-tx-btn" class="frost-btn slim wide">Record</button>
                    </div>
                </div>

                <div class="frost-divider">
                    <span class="divider-ice"></span>
                </div>

                <div class="ledger-scroll">
                    <div class="ledger-header">
                        <span>Transaction Log</span>
                    </div>
                    <div class="ledger-entries" id="transaction-list"></div>
                </div>
            </div>
        </main>

        <footer class="frost-footer">
            <div class="footer-left">
                <span class="status-crystal" id="status-bulb"></span>
                <span class="status-word" id="status">ready</span>
            </div>
            <div class="footer-right">
                <span class="frost-clock" id="clock">--:--:--</span>
            </div>
        </footer>
    </div>
    <script src="popup.js"></script>
</body>
</html>
